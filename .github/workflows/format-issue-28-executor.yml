name: Format Issue 28 Executor (temporary)

on:
  push:
    branches:
      - codex/issue-28-shared-executor

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-28-shared-executor
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "packages/fleet-mcp/src/executor*.ts" "apps/server/src/fleet-composition*.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet -- packages/fleet-mcp/src/executor.ts packages/fleet-mcp/src/executor.test.ts apps/server/src/fleet-composition.ts apps/server/src/fleet-composition.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/fleet-mcp/src/executor.ts packages/fleet-mcp/src/executor.test.ts apps/server/src/fleet-composition.ts apps/server/src/fleet-composition.test.ts
          git commit -m "style: format shared Fleet executor sources"
          git push origin HEAD:codex/issue-28-shared-executor
