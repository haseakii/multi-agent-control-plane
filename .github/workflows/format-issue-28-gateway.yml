name: Format Issue 28 Gateway (temporary)

on:
  push:
    branches:
      - codex/issue-28-fleet-gateway

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-28-fleet-gateway
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/server/src/fleet-gateway*.ts" "apps/server/src/server.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/server/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/fleet-gateway.ts apps/server/src/fleet-gateway.test.ts apps/server/src/server.ts
          git commit -m "style: format Fleet bridge gateway sources"
          git push origin HEAD:codex/issue-28-fleet-gateway
