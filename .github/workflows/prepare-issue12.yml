name: Prepare Issue 12 (temporary)

on:
  push:
    branches:
      - codex/issue-12-web-e2e

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-12-web-e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm exec prettier --write "apps/server/src/*.ts" "apps/web/src/*.{ts,tsx,css}" "apps/web/vite.config.ts" "playwright.config.ts" "tests/e2e/*.ts"
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/server/src apps/web/src apps/web/vite.config.ts playwright.config.ts tests/e2e
          git commit -m "chore: prepare Issue 12 lockfile and formatting"
          git push origin HEAD:codex/issue-12-web-e2e
