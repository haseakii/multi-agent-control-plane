name: Prepare Issue 29 (temporary)

on:
  push:
    branches:
      - codex/issue-29-agent-controls

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-29-agent-controls
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          "packages/runner/src/*.ts"
          "packages/acp-runtime/src/*.ts"
          "apps/server/src/*.ts"
          "apps/web/src/*.{tsx,css}"
          "package.json"
          "apps/server/package.json"
          "packages/acp-runtime/package.json"
      - name: Commit generated lockfile and formatting
        run: |
          git add pnpm-lock.yaml package.json apps/server/package.json packages/acp-runtime/package.json packages/runner/src packages/acp-runtime/src apps/server/src apps/web/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format issue 29 and refresh lockfile"
          git push origin HEAD:codex/issue-29-agent-controls
