name: Format Issue 28 (temporary)

on:
  push:
    branches:
      - codex/issue-28-session-attachment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-28-session-attachment
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "packages/fleet-mcp/src/session-attachment*.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet -- packages/fleet-mcp/src/session-attachment.ts packages/fleet-mcp/src/session-attachment.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/fleet-mcp/src/session-attachment.ts packages/fleet-mcp/src/session-attachment.test.ts
          git commit -m "style: format Fleet MCP session attachment"
          git push origin HEAD:codex/issue-28-session-attachment
