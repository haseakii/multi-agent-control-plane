name: Format Policy Workspace (temporary)

on:
  push:
    branches:
      - codex/issue-11-policy-workspaces

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-11-policy-workspaces
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "packages/policy/src/*.ts" "packages/workspace/src/*.ts" "packages/storage/src/schema.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet -- packages/policy/src packages/workspace/src packages/storage/src/schema.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/policy/src packages/workspace/src packages/storage/src/schema.ts
          git commit -m "style: format policy and workspace sources"
          git push origin HEAD:codex/issue-11-policy-workspaces
